<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Loot Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Dungeon Loot Tracker</h1>

        <div class="form-area">
            <label for="lootName">Loot Name:</label>
            <input type="text" id="lootName" placeholder="Example: Flaming Sword">

            <label for="lootValue">Loot Value:</label>
            <input type="number" id="lootValue" placeholder="Example: 75">

            <button id="addLootButton">Add Loot</button>
        </div>

        <p id="message"></p>

        <h2>Loot List</h2>
        <div id="lootList">
            No loot added yet.
        </div>

        <p id="totalValue">Total Loot Value: 0 gold</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
